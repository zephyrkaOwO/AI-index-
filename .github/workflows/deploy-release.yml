
name: Deploy website from Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Select release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$EVENT_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download HTML from Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p release-file
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.html" \
            --dir release-file

      - name: Prepare website
        run: |
          mapfile -t html_files < <(
            find release-file -maxdepth 1 -type f -iname '*.html'
          )

          if [ "${#html_files[@]}" -ne 1 ]; then
            echo "Ошибка: ожидался ровно один HTML-файл."
            echo "Найдено: ${#html_files[@]}"
            ls -la release-file
            exit 1
          fi

          test -s "${html_files[0]}"
          cp "${html_files[0]}" index.html

      - name: Commit and push
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "Сайт уже актуален"
            exit 0
          fi

          git commit -m "Deploy website from release $RELEASE_TAG"
          git push origin HEAD:main
